name: Deploy to Cloudflare Pages

# 国内访问加速：把 dist 同步部署到 Cloudflare Pages
# 跟 deploy.yml（GitHub Pages）并行触发，互不阻塞
# 配置：在仓库 Settings → Secrets and variables → Actions 加三个 Secret
#   CLOUDFLARE_API_TOKEN  — Cloudflare Profile → API Tokens → "Edit Cloudflare Pages" 模板生成
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Dashboard 右下角 Account ID
#   VITE_GEO_WORKER_URL   — 同 .env.production，例如 https://luvrix.dpdns.org

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GEO_WORKER_URL: ${{ secrets.VITE_GEO_WORKER_URL }}
          # CF Pages 部署在根路径，覆盖 vite.config.ts 默认的 /travel/
          VITE_BASE_PATH: /
      - name: Create Pages project if not exists
        run: npx wrangler pages project create travel --production-branch=master || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=travel --branch=master --commit-dirty=true
